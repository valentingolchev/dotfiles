# Foot terminal configuration
# Theme: Kanagawa (copied from kitty)
# https://codeberg.org/dnkl/foot/src/branch/master/foot.ini

# Shell
shell=zsh

# Font (from kitty: font_family Hack Nerd Font Mono, font_size 14.0)
font=Hack Nerd Font Mono:size=14

# Window
initial-window-size-chars=120x30
pad=10x10 center

# Cursor
cursor=c8c093 dcd7ba

# Selection
selection-foreground=c8c093
selection-background=2d4f67

# URL
url-color=72a7bc

# Colors (Kanagawa theme from kitty)
[colors]
alpha=0.95

# Basic colors
foreground=dcd7ba
background=1f1f28

# Regular colors (color0-7)
regular0=16161d
regular1=c34043
regular2=76946a
regular3=c0a36e
regular4=7e9cd8
regular5=957fb8
regular6=6a9589
regular7=c8c093

# Bright colors (color8-15)
bright0=727169
bright1=e82424
bright2=98bb6c
bright3=e6c384
bright4=7fb4ca
bright5=938aa9
bright6=7aa89f
bright7=dcd7ba

# Extended colors (color16-17)
# foot uses regular0-7 and bright0-7 for the 16 base colors
# Additional colors can be set with 256-color palette

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes

[key-bindings]
# Copy/paste (same as most terminals)
copy=Mod4+c
paste=Mod4+v
paste-primary=Shift+Insert

# Scrollback
scrollback-up=Mod4+Page_Up
scrollback-down=Mod4+Page_Down
scrollback-home=Mod4+Home
scrollback-end=Mod4+End

# Font size
increase-font-size=Mod4+plus
decrease-font-size=Mod4+minus
reset-font-size=Mod4+0

# Fullscreen
fullscreen=Mod4+f

# New window (spawn new foot instance)
spawn=Mod4+Return
