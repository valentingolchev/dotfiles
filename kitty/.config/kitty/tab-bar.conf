#: Tab bar {{{

tab_bar_edge top

#tab_bar_filter session:~ or session:^$
tab_bar_min_tabs 2

tab_bar_style powerline
tab_powerline_style angled

tab_title_template "{index}:{title or session_name or tab.active_wd.rsplit('/', 1)[-1]} ◯"
active_tab_title_template "{index}:{title or session_name or tab.active_wd.rsplit('/', 1)[-1]} ●"

#: }}}
