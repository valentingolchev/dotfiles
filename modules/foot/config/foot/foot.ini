# Foot terminal configuration
# Theme: [colors-dark]/[colors-light] sections; USR1/USR2 sent by darkman hooks / theme-sync-macos — live switch, all clients
# https://codeberg.org/dnkl/foot/src/branch/master/foot.ini

# Shell
shell=zsh

# Font (from kitty: font_family Hack Nerd Font Mono, font_size 14.0)
font=Hack Nerd Font Mono:size=14

# Window
initial-window-size-chars=120x30
pad=10x10 center

[scrollback]
lines=10000

[mouse]
hide-when-typing=yes

[key-bindings]
# Copy/paste (same as most terminals)
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert

# Scrollback
scrollback-up-page=Control+Shift+Page_Up
scrollback-down-page=Control+Shift+Page_Down
scrollback-home=Control+Shift+Home
scrollback-end=Control+Shift+End

# Font size
font-increase=Control+Shift+plus
font-decrease=Control+Shift+minus
font-reset=Control+Shift+0

# Fullscreen
fullscreen=Control+Shift+f

# New window (spawn new foot instance)
spawn-terminal=Control+Shift+Return

[colors-dark]
foreground = d3c6aa
background = 333c43
cursor = c8c093 dcd7ba
selection-foreground = c8c093
selection-background = 2d4f67
urls = 72a7bc

